name: Caplo
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    macOS: '15.0'
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
packages:
  CaploKit:
    path: Packages/CaploKit
targets:
  Caplo:
    type: application
    platform: macOS
    sources: [App]
    configFiles:
      Debug: Config/Debug.xcconfig
    entitlements:
      path: App/Caplo.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        NSMicrophoneUsageDescription: 用于录制讲解声音，麦克风素材会保存在本地工程中。
        NSCameraUsageDescription: 用于录制讲解人像，摄像头视频会作为独立素材保存在本地工程中。
        NSCameraUseContinuityCameraDeviceType: true
        # 本地转写字幕用。缺了这项系统会在第一次请求语音识别权限时直接终止应用；重新生成工程前必须保留。
        NSSpeechRecognitionUsageDescription: 用于把录制的讲解声音转写成字幕。转写全部在本机完成，音频不会离开这台电脑。
        # 在线更新（Sparkle）：地址与公钥由发布流水线通过构建设置写入，开发构建为空，应用据此不启动更新。
        SUFeedURL: $(CAPLO_UPDATE_FEED_URL)
        SUPublicEDKey: $(CAPLO_UPDATE_PUBLIC_KEY)
        # 默认自动检查（每天一次），不在第二次启动时弹系统式授权询问；用户可在设置里关闭。
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # 先校验 EdDSA 签名再解包，签名不对的包不落到解压步骤。
        SUVerifyUpdateBeforeExtraction: true
        # appcast 本身也要求 EdDSA 签名：即使下载服务器上的文件被改，客户端也不会被引去别的安装包。
        SURequireSignedFeed: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Caplo 工程
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.caplo.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.caplo.project
            UTTypeDescription: Caplo 录制工程
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [caplo]
    dependencies:
      - package: CaploKit
        product: Features
    settings:
      base:
        CAPLO_APP_IDENTIFIER: com.caplo.app
        CAPLO_APP_NAME: Caplo
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPLO_APP_IDENTIFIER)
        PRODUCT_NAME: $(CAPLO_APP_NAME)
        # 发布时由流水线按标签覆盖：vX.Y.Z → MARKETING_VERSION=X.Y.Z、CURRENT_PROJECT_VERSION=X*1000000+Y*1000+Z。
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 1
        CAPLO_UPDATE_FEED_URL: ""
        CAPLO_UPDATE_PUBLIC_KEY: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_CFBundleDisplayName: Caplo
      # 调试版与正式版隔离：独立的包标识与名称，权限、设置、登录项和工程库互不影响（工程库见 ProjectStorage.libraryURL）。
      configs:
        Debug:
          CAPLO_APP_IDENTIFIER: com.caplo.app.dev
          CAPLO_APP_NAME: Caplo Dev
    scheme:
      gatherCoverageData: true
