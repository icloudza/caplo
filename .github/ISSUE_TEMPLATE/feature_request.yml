name: 功能建议 / Feature Request
description: 提出新功能或改进现有体验
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 你在什么场景下遇到了什么不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法 / Proposal
      description: 你希望 Caplo 怎么做，可以附上参考截图或其他软件的做法。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代办法 / Alternatives
      description: 可选。目前是怎么绕过去的。
